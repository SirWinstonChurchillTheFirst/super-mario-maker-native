# game.conf: what tools/native-build.sh needs to know about this game. No game data in here.
TITLE="Super Mario Maker"
NAME=maker
RPX=Block.rpx
TESTED_TITLE_ID=000500001018DD00
TESTED_REGION="Europe"
RECOMP_ARGS="--any-rpx"
# A function reached only through a pointer (after a blr), missed by the recompiler's function discovery.
RECOMP_ENTRIES=0272B9A4
BUILD_MINUTES=5-15
DISK_GB=2
# The editor is on the GamePad: its picture is shown in the window (left stick click switches), mouse = touch,
# right stick = touch cursor, ZR / right stick click = touch. Part of the tile atlas is written by the CPU.
START_ENV="TTT2_SHOW_GAMEPAD=1 CAFE_TOUCH_UI=1 TTT2_RELOAD_TARGETS=1"
SYS_TITLES=10056000
SYS_NOTE_DE="WICHTIG: Ohne die Mii-Dateien deiner eigenen Wii U (-SysDir / --sys, Ordner mlc01/sys) bleibt Super Mario Maker am Anfang stehen."
SYS_NOTE_EN="IMPORTANT: without the Mii files of your own Wii U (-SysDir / --sys, an mlc01/sys folder) Super Mario Maker stops early."
